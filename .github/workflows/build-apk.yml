name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Textura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishes the APK at a fixed link:
      # https://github.com/Bigoke/Textura/releases/latest/download/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Textura latest build
          body: Debug APK built from the latest commit on main.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
