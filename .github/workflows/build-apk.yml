name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Save build log to the buildlog branch
        if: always()
        run: |
          mkdir -p /tmp/bl && cp build.log /tmp/bl/build.log 2>/dev/null || echo "no log" > /tmp/bl/build.log
          cd /tmp/bl && git init -q -b buildlog
          git config user.name "build-bot" && git config user.email "bot@users.noreply.github.com"
          git add build.log && git commit -q -m "build log ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog

      - uses: actions/upload-artifact@v4
        with:
          name: Textura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishes the APK at a fixed link:
      # https://github.com/Bigoke/Textura/releases/latest/download/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Textura latest build
          body: Debug APK built from the latest commit on main.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
